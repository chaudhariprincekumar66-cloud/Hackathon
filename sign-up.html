<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
        }
        #con-1{
            border: solid black 2px;
            width: 300px;
            margin: auto;
            height: 300px;
            /* justify-content: center; */
            text-align: center;
            background-color: aqua;
        }
        #main-1{
            padding-top: 40px;
            

        }
        #main-1 input{
            height: 25px;
            width:auto;

        }
        #main-2{
            padding-top: 40px;

        }
        #main-2 input{
            height: 25px;
            width: auto;
        }
        #main-3{
            padding-top: 40px;
        }
        #main-3 button{
            background-color: rgb(214, 127, 127);
        }


    </style>
</head>
<body>
    <div id="con-1">
        <h2>Create your account </h1>
    <form id="signupForm">

    <div id="main-1"><label for="email">Email</label>
    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
    ></div>

    <div id="main-2"><label for="password">Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
    ></div>

    <div id="main-3"><button type="submit">Create Account</button></div>

</form>
</div>

<p id="message"></p>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
<script>
    const SUPABASE_URL = "https://vpfuqnptjvwtqwvfpedz.supabase.co";


    const SUPABASE_KEY = "sb_publishable_CpsuP5fGvdYyuDhGTrtiwA_LB9eSdUt";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
document.getElementById("signupForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
    });

    if (error) {

        document.getElementById("message").textContent =
            error.message;

        return;
    }

    document.getElementById("message").textContent =
        "Account created successfully!";

});
    
</script>
 
</body>
</html>
